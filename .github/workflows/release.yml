name: Release

# Pushing a tag like v1.2.3 builds a signed, notarized .dmg and publishes it
# as a GitHub release in the public releases repo, not this one.
#
# Runs on macos-15 for a Swift 6 toolchain matching Package.swift's
# `swift-tools-version: 6.0` / `.macOS(.v14)`. macOS runners bill at 10x the
# minutes of a Linux runner on a private repo — a tagged release is meant to
# be rare, not something CI does on every push.
on:
  push:
    tags:
      - "v*"

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || 'mydevmachine/app-releases' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML with Ruby
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            ruby -ryaml -e "YAML.safe_load(File.read(ARGV[0]), aliases: true)" "$f"
            echo "ok: $f"
          done
      - name: "Refuse a step if: that reads secrets directly"
        run: |
          set -euo pipefail
          if grep -RnE '^\s*if:\s*.*\bsecrets\.' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null; then
            echo "a step 'if:' reads the secrets context directly; GitHub Actions forbids this" >&2
            echo "read the secret's presence into a job-level env var first" >&2
            exit 1
          fi

  release:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # `secrets` cannot appear in a step's `if:`, so its presence is read here.
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
      HAS_TAP_APP: ${{ secrets.TAP_APP_ID != '' && secrets.TAP_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SwiftTerm needs Swift 6.2; the runner's default Xcode ships an older one.
      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain
        run: swift --version

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # mosh-client is built from source (scripts/fetch_mosh.sh, about a
      # minute); the result only changes when that script does.
      - name: Cache the embedded mosh-client
        uses: actions/cache@v4
        with:
          path: vendor/mosh
          key: mosh-client-${{ runner.os }}-${{ hashFiles('scripts/fetch_mosh.sh') }}

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$CERT_PATH"

      - name: Derive signing identity
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' \
            | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\) [A-F0-9]+ "(.+)"$/\1/')"
          if [ -z "$identity" ]; then
            echo "no 'Developer ID Application' identity found in the imported certificate" >&2
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "DEVMACHINE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Package, sign, dmg, notarize, staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DEVMACHINE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make_dmg.sh

      - name: Compute sha256
        id: sha
        run: |
          dmg="build/Devmachine-${{ steps.version.outputs.version }}.dmg"
          stable="build/Devmachine.dmg"
          cp "$dmg" "$stable"
          # The app's updater downloads this next to the dmg and refuses a
          # download whose digest differs. `cd` keeps the bare file name in
          # the line, the same format `shasum -c` reads.
          (cd build && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "digest=$dmg.sha256" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # Two copies of the same dmg: the versioned one is the release asset
          # of record (and what the Homebrew cask points at), and the
          # stable-named copy is what
          # .../releases/latest/download/Devmachine.dmg always serves, so a
          # direct download link never has to change. The `.sha256` beside
          # the versioned one is what the app's updater checks.
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.sha.outputs.dmg }}" "${{ steps.sha.outputs.digest }}" "${{ steps.sha.outputs.stable }}" \
            --repo "$RELEASES_REPO" \
            --title "Devmachine ${{ steps.version.outputs.version }}" \
            --notes "sha256: ${{ steps.sha.outputs.sha256 }}"

      - name: Render Homebrew cask
        id: render-cask
        if: env.HAS_TAP_APP == 'true' || env.HAS_TAP_TOKEN == 'true'
        run: |
          set -euo pipefail
          sed \
            -e "s/{{VERSION}}/${{ steps.version.outputs.version }}/" \
            -e "s/{{SHA256}}/${{ steps.sha.outputs.sha256 }}/" \
            -e "s#{{RELEASES_REPO}}#$RELEASES_REPO#" \
            packaging/devmachine-app.rb.template > devmachine-app.rb
          ruby -c devmachine-app.rb

      # A GitHub App token is preferred over a personal token: it does not
      # expire, so a release cannot break a year from now because nobody
      # rotated a token (same setup the CLI repo's release uses, see
      # docs/RELEASING.md "Homebrew cask").
      - uses: actions/create-github-app-token@v2
        id: tap-app-token
        if: env.HAS_TAP_APP == 'true'
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: mydevmachine
          repositories: homebrew-tap

      - name: Update Homebrew cask (GitHub App)
        if: env.HAS_TAP_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.tap-app-token.outputs.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/mydevmachine/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cp devmachine-app.rb "$RUNNER_TEMP/tap/Casks/devmachine-app.rb"
          cd "$RUNNER_TEMP/tap"
          ruby -c Casks/devmachine-app.rb
          # Signed commits are not possible from CI (no way to hold a GPG/SSH
          # signing key for the app bot); an ordinary commit by the bot is
          # fine here.
          git -c user.name=devmachine-release -c user.email=release@mydevmachine.sh \
            commit -am "feat: devmachine-app ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      # Fallback: a plain fine-grained token against the tap, opening a PR
      # instead of committing straight to main. Used only when no GitHub App
      # is configured on this repo.
      - name: Render Homebrew cask PR (fallback token)
        if: env.HAS_TAP_APP != 'true' && env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          branch="release-${{ steps.version.outputs.version }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mydevmachine/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cp devmachine-app.rb "$RUNNER_TEMP/tap/Casks/devmachine-app.rb"
          cd "$RUNNER_TEMP/tap"
          git -c user.name=devmachine-release -c user.email=release@mydevmachine.sh \
            checkout -b "$branch"
          git -c user.name=devmachine-release -c user.email=release@mydevmachine.sh \
            commit -am "devmachine-app ${{ steps.version.outputs.version }}"
          git push origin "$branch"
          gh pr create --repo mydevmachine/homebrew-tap \
            --title "devmachine-app ${{ steps.version.outputs.version }}" \
            --body "Automated cask bump from ${{ github.repository }}@${{ github.sha }}." \
            --head "$branch"

      - name: Clean up signing keychain and API key
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          [ -n "${APPLE_API_KEY_PATH:-}" ] && rm -f "$APPLE_API_KEY_PATH" || true
